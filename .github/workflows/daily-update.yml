name: Daily Update & Deploy

on:
  schedule:
    # 22:00 UTC = 07:00 KST (한국 시간 매일 오전 7시)
    - cron: '0 22 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 자동 commit 권한
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  predict:
    # cron 또는 수동 실행 시에만 예측 재계산. 일반 push 에서는 스킵.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas matplotlib requests

      - name: Install Korean font (NanumGothic)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          rm -rf ~/.cache/matplotlib

      - name: Fetch NESDC pending polls (검토용 알림만 — 자동 추가 X)
        env:
          TZ: Asia/Seoul
        run: |
          python scripts/fetch_polls.py --days 7 || true

      - name: Run prediction (KST date) — 부산 + 서울
        env:
          TZ: Asia/Seoul
        run: |
          export PREDICT_AS_OF=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "KST date: $PREDICT_AS_OF"
          python scripts/predict_busan.py
          python scripts/predict_seoul.py

      - name: Build poll trend (서울 + 부산 골든크로스)
        env:
          TZ: Asia/Seoul
        run: |
          python scripts/build_poll_trend.py

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/ web/plots/ data/processed/busan/ data/processed/seoul/
          [ -f data/raw/busan/pending_polls_busan.csv ] && git add data/raw/busan/pending_polls_busan.csv || true
          [ -f data/raw/seoul/pending_polls_seoul.csv ] && git add data/raw/seoul/pending_polls_seoul.csv || true
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
            git commit -m "chore: daily prediction update ($KST)"
            git push
          fi

  deploy:
    # predict 가 끝났거나 (그래서 새 커밋이 push 됐거나), 단순 push 가 들어왔을 때 배포
    needs: predict
    if: always() && (needs.predict.result == 'success' || needs.predict.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (latest, including bot commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
